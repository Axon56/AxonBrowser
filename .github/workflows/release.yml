name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: Linux ${{ matrix.arch }} bundle
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:12
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y curl ca-certificates build-essential pkg-config

      - name: Install Rust
        run: |
          set -euo pipefail
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo fmt --check

      - name: Clippy
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo test

      - name: Build release binary
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release --bins

      - name: Assemble release bundle
        env:
          BUNDLE_NAME: axonbrowser-linux-${{ matrix.arch }}
          BUILD_BINARIES: "0"
        run: |
          set -euo pipefail
          bash scripts/build-release-bundle.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: axonbrowser-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/release/axonbrowser-linux-${{ matrix.arch }}.tar.gz
            dist/release/axonbrowser-linux-${{ matrix.arch }}.tar.gz.sha256

  publish:
    name: Publish release
    needs: bundle
    # Publish whatever bundles succeeded, so one failing architecture cannot
    # withhold the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect bundles
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Add installer
        run: |
          set -euo pipefail
          cp install.sh dist/release/install.sh
          ls -l dist/release

      - name: Select release notes
        id: notes
        run: |
          set -euo pipefail
          body=".github/release-body-${GITHUB_REF_NAME}.md"
          if [[ -f "$body" ]]; then
            echo "body_path=$body" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with curated notes
        if: ${{ steps.notes.outputs.body_path != '' }}
        uses: softprops/action-gh-release@v2
        with:
          name: AxonBrowser ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/install.sh

      - name: Publish with generated notes
        if: ${{ steps.notes.outputs.body_path == '' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/install.sh
