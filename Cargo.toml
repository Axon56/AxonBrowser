[package]
name = "axonbrowser"
version = "1.1.3"
edition = "2024"
default-run = "axonbrowser"
license = "MIT"

[dependencies]
anyhow = "1"
async-recursion = "1"
atspi = { version = "0.29.0", features = ["tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = "0.28"
