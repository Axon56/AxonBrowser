<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sticky Occluded Demo</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #nav { position: sticky; top: 0; height: 260px; background: #123; z-index: 100; }
  #nav a { display: block; height: 130px; line-height: 130px; padding-left: 20px;
           color: #fff; text-decoration: none; font-size: 28px; }
  #spacer { height: 1200px; background: #eee; }
  #form { padding: 20px; }
  label { display: block; margin-top: 12px; }
</style>
</head>
<body>
<nav id="nav">
  <a id="travel" href="prohibited.html">TRAVEL</a>
  <a id="routes" href="prohibited.html">ROUTES</a>
</nav>
<div id="spacer">scroll filler</div>
<div id="form">
  <h1>Sticky Occluded Demo</h1>
  <label for="departure-date">Departure date</label>
  <input id="departure-date" type="text" placeholder="DD MMM YYYY" readonly>
  <p id="status">Nothing clicked yet.</p>
  <button id="confirm">Confirm Booking</button>
</div>
<script>
  // The date field starts under the sticky header, so a scroll-into-view leaves
  // it at the top edge where the header covers it. The header link is focusable,
  // so a click that hits it makes the header take focus and the calendar never
  // opens -- the failure mode being reproduced.
  document.getElementById('departure-date').addEventListener('click', function () {
    document.getElementById('status').textContent = 'Departure date clicked.';
  });
  window.scrollTo(0, 1180);
</script>
</body>
</html>
