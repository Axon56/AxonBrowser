<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Combobox Demo</title>
<style>
  body { margin: 0; font-family: sans-serif; padding: 20px; }
  .combo { border: 1px solid #999; padding: 8px; width: 260px; cursor: pointer; }
  #list { border: 1px solid #ccc; width: 260px; max-height: 160px; overflow: auto; }
  #list[hidden] { display: none; }
  /* Options are list items, not <option>, like a custom autocomplete. */
  #list li { padding: 6px 8px; cursor: pointer; list-style: none; }
  #list li:hover { background: #eee; }
</style>
</head>
<body>
<h1>Combobox Demo</h1>

<div class="combo" id="origin" role="combobox" aria-expanded="false" tabindex="0"
     aria-label="Departure airport">Select airport</div>
<ul id="list" role="listbox" hidden>
  <li role="option">Lagos LOS</li>
  <li role="option">Abuja ABV</li>
  <li role="option">Lagos LOS</li>
</ul>
<p id="status">Nothing selected.</p>

<script>
  var combo = document.getElementById('origin');
  var list = document.getElementById('list');
  combo.addEventListener('click', function () {
    list.hidden = !list.hidden;
    combo.setAttribute('aria-expanded', String(!list.hidden));
  });
  Array.prototype.forEach.call(list.children, function (li) {
    li.addEventListener('click', function () {
      combo.textContent = li.textContent;
      document.getElementById('status').textContent = 'Selected: ' + li.textContent;
      list.hidden = true;
      combo.setAttribute('aria-expanded', 'false');
    });
  });
</script>
</body>
</html>
