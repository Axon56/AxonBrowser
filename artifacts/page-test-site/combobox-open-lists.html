<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Combobox Open Lists Demo</title>
<style>
  body { margin: 0; font-family: sans-serif; padding: 20px; }
  .combo { border: 1px solid #999; padding: 8px; width: 260px; cursor: pointer; }
  /* Both lists stay in the document at all times, like the choices.js widget a
     real booking site uses. Only visibility changes, so the accessibility tree
     exposes the options of a *closed* dropdown too -- which is what let a
     selection meant for one control match the other control's list. */
  ul.list { border: 1px solid #ccc; width: 260px; margin: 0; padding: 0;
            list-style: none; max-height: 0; overflow: hidden; }
  ul.list.open { max-height: 200px; overflow: auto; }
  li { padding: 6px 8px; cursor: pointer; }
  li:hover { background: #eee; }
</style>
</head>
<body>
<h1>Combobox Open Lists Demo</h1>

<p id="from-label">Departure airport</p>
<div class="combo" id="origin" role="combobox" aria-expanded="false" tabindex="0"
     aria-label="Departure airport">Select airport</div>
<ul class="list" id="origin-list" role="listbox" aria-label="Departure airport options">
  <li role="option">Lagos LOS</li>
  <li role="option">Abuja ABV</li>
</ul>

<p id="to-label">Arrival airport</p>
<div class="combo" id="destination" role="combobox" aria-expanded="false" tabindex="0"
     aria-label="Arrival airport">Select airport</div>
<ul class="list" id="destination-list" role="listbox" aria-label="Arrival airport options">
  <li role="option">Lagos LOS</li>
  <li role="option">Abuja ABV</li>
</ul>

<p id="status">Nothing selected.</p>

<script>
  [['origin', 'origin-list'], ['destination', 'destination-list']].forEach(function (pair) {
    var combo = document.getElementById(pair[0]);
    var list = document.getElementById(pair[1]);
    combo.addEventListener('click', function () {
      // Only one list is open at a time, exactly like a real dropdown widget.
      document.querySelectorAll('ul.list').forEach(function (other) {
        if (other !== list) other.classList.remove('open');
      });
      document.querySelectorAll('.combo').forEach(function (other) {
        if (other !== combo) other.setAttribute('aria-expanded', 'false');
      });
      list.classList.toggle('open');
      combo.setAttribute('aria-expanded', String(list.classList.contains('open')));
    });
    Array.prototype.forEach.call(list.children, function (li) {
      li.addEventListener('click', function () {
        combo.textContent = li.textContent;
        document.getElementById('status').textContent = pair[0] + ': ' + li.textContent;
        list.classList.remove('open');
        combo.setAttribute('aria-expanded', 'false');
      });
    });
  });
</script>
</body>
</html>
